# 프로필 카드 생성 — lowlighter/metrics
#
# 왜 이걸 쓰나:
#   기존 github-profile-summary-cards 는 외부 서비스가 공개 데이터만 볼 수 있어
#   비공개 레포(AllTeachers·JobCatchers)의 커밋 약 1,790건이 통째로 빠졌고,
#   언어 카드는 "레포당 대표 언어 1개"만 세서 JavaScript 처럼 항상 2등인 언어가
#   영원히 0표였다. metrics 는 내 토큰으로 Actions 안에서 돌기 때문에 비공개 레포를
#   포함하고, 언어는 바이트/커밋 기준으로 센다.
#
# 준비물(형년님이 직접):
#   1. GitHub Settings → Developer settings → Personal access tokens (classic)
#      → repo 스코프 체크하고 발급
#   2. 이 레포 Settings → Secrets and variables → Actions → New repository secret
#      이름: METRICS_TOKEN / 값: 발급받은 토큰
#   토큰이 없으면 워크플로는 실패한다(공개 데이터만 쓰려면 secrets.GITHUB_TOKEN 로 바꿔도 됨).

name: Metrics

on:
  schedule:
    - cron: "0 20 * * *"   # 매일 UTC 20:00 = KST 오전 5시
  workflow_dispatch:        # 수동 실행 버튼
  push:
    branches: [main]

permissions:
  contents: write           # 생성된 SVG 를 레포에 커밋해야 한다

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # ── 1. 종합 카드 — 커밋·활동·잔디 (비공개 레포 포함) ──────────────────
      - name: 종합 통계
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: BroYears
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Seoul
          config_animations: no
          extras_css: |
            h1, h2, h3 { color: #0f766e !important; }
            path[fill="#9be9a8"] { fill: #99f6e4; }
            path[fill="#40c463"] { fill: #2dd4bf; }
            path[fill="#30a14e"] { fill: #14b8a6; }
            path[fill="#216e39"] { fill: #0f766e; }
            @media (prefers-color-scheme: dark) {
              h1, h2, h3 { color: #5eead4 !important; }
            }
          # 잔디 달력 — 비공개 기여까지 합산된다
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # ── 2. 언어 카드 — 바이트 기준, 대표 언어 방식 아님 ──────────────────
      - name: 언어 통계
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: BroYears
          filename: metrics.plugin.languages.svg
          template: classic
          base: ""                        # 헤더 없이 언어 섹션만
          config_timezone: Asia/Seoul
          config_animations: no
          extras_css: |
            h1, h2, h3 { color: #0f766e !important; }
            path[fill="#9be9a8"] { fill: #99f6e4; }
            path[fill="#40c463"] { fill: #2dd4bf; }
            path[fill="#30a14e"] { fill: #14b8a6; }
            path[fill="#216e39"] { fill: #0f766e; }
            @media (prefers-color-scheme: dark) {
              h1, h2, h3 { color: #5eead4 !important; }
            }
          plugin_languages: yes
          # indepth 는 껐다. 레포를 통째로 스캔하면서 빌드 산출물·의존성·바이너리까지
          # "알 수 없는 언어"로 세는 바람에 Other 가 91.7%(11.9MB)를 차지하고
          # Java 가 4.75% 로 밀렸다. GitHub 이 집계한 언어 바이트를 그대로 쓰는 편이 정확하다.
          plugin_languages_indepth: no
          # recently-used 는 indepth 전용이라 껐다(빈 섹션만 나왔다).
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          # Other 로 뭉뚱그리지 않는다 — 실제 언어 이름이 보여야 의미가 있다.
          plugin_languages_other: no
          # 프로필 레포 자체는 SVG 뿐이라 통계에서 뺀다.
          # allteachers_outsource 는 이전 사이트의 PHP 외주본(2026-03 가져옴)이라
          # 내가 쓴 코드가 아니다. 넣어두면 PHP 6.19MB 가 1위(25.1%)로 잡혀
          # 프로필이 PHP 개발자처럼 읽힌다. 레포는 참고용으로 남기고 통계에서만 뺀다.
          plugin_languages_skipped: BroYears, desktop-tutorial, allteachers_outsource
